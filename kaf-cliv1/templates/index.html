<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kaf-cli 繁體中文電子書轉換器 (Web 版)</title>
    <style>
        :root {
            --bg-color: #121418;
            --card-bg: #1c1f26;
            --border-color: #2e3440;
            --text-color: #e5e9f0;
            --text-muted: #8892b0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 960px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-title h1 {
            margin: 0;
            font-size: 22px;
            color: #fff;
        }
        .header-title h1 span {
            color: var(--primary);
        }
        .header-title p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .badge-status {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: bold;
        }
        .tab-btn:hover:not(.active) {
            color: var(--text-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 220px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            background: #14171d;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s;
        }
        .dropzone:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }
        .btn {
            background: #282e3a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #353d4d;
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-large {
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 8px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
        }
        .quick-btn {
            padding: 4px 8px;
            font-size: 12px;
            background: #242933;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
        }
        .quick-btn:hover {
            color: #fff;
            border-color: var(--primary);
        }
        .log-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            height: 250px;
            overflow-y: auto;
            color: #58a6ff;
            white-space: pre-wrap;
            margin-top: 10px;
        }
        .progress-bar {
            height: 8px;
            background: #242933;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
        .download-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #14171d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 8px;
        }
        /* 彈出視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            width: 90%;
            max-width: 680px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .modal-body {
            overflow-y: auto;
            flex: 1;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }
        th {
            background: #14171d;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-title">
            <h1><span>kaf-cli</span> 繁體中文電子書轉換器</h1>
            <p>快速將 TXT 文字小說轉換為高畫質 EPUB / MOBI / AZW3 電子書</p>
        </div>
        <div id="statusBadge" class="badge-status">
            <span class="badge-dot"></span>
            <span id="statusText">檢測中...</span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">📚 檔案與轉換</button>
        <button class="tab-btn" onclick="switchTab(1)">📐 排版與版面</button>
        <button class="tab-btn" onclick="switchTab(2)">🔍 章節與分卷匹配</button>
        <button class="tab-btn" onclick="switchTab(3)">🎨 封面設定</button>
        <button class="tab-btn" onclick="switchTab(4)">🖋️ 自訂 CSS 樣式</button>
        <button class="tab-btn" onclick="switchTab(5)">💻 即時日誌與下載</button>
    </div>

    <!-- TAB 1: 檔案與轉換 -->
    <div class="tab-content active" id="tab0">
        <div class="card">
            <h3 class="card-title">1. 選取或上傳小說 TXT 檔案</h3>
            <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                <p style="font-size: 16px; margin: 0 0 8px 0;">📂 點擊選取或拖曳小說 TXT 檔案至此</p>
                <p style="font-size: 12px; color: var(--text-muted); margin: 0;">支援自動解析書名與作者 (例: 《希靈帝國》作者：遠瞳.txt)</p>
                <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="handleFileSelect(event)">
            </div>
            <div id="fileInfo" style="display:none; margin-top: 14px; padding: 12px; background: #14171d; border-radius: 6px;">
                <div class="form-row">
                    <div class="form-group">
                        <label>書籍名稱 (-bookname):</label>
                        <input type="text" id="booknameInput">
                    </div>
                    <div class="form-group">
                        <label>書籍作者 (-author):</label>
                        <input type="text" id="authorInput" value="YSTYLE">
                    </div>
                </div>
                <div id="detectBanner" style="display:none; margin-top: 10px; padding: 10px 14px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 6px; font-size: 13px; color: #93c5fd;"></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">2. 輸出格式與簡繁轉換</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>輸出書籍格式 (-format):</label>
                    <select id="formatSelect">
                        <option value="all">全部生成 (ALL: EPUB + MOBI + AZW3)</option>
                        <option value="epub" selected>僅 EPUB (.epub)</option>
                        <option value="mobi">僅 MOBI (.mobi - 需 kindlegen)</option>
                        <option value="azw3">僅 AZW3 (.azw3)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>內文簡繁轉換:</label>
                    <select id="zhSelect">
                        <option value="s2tw" selected>簡體轉臺灣正體 (s2tw, 推薦)</option>
                        <option value="s2hk">簡體轉香港繁體 (s2hk)</option>
                        <option value="s2t">簡體轉標準繁體 (s2t)</option>
                        <option value="none">不轉換 (保持原文)</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 25px;">
            <button class="btn btn-primary btn-large" id="btnStart" onclick="startConvert()">🚀 開始轉換電子書</button>
        </div>
    </div>

    <!-- TAB 2: 排版與版面 -->
    <div class="tab-content" id="tab1">
        <div class="card">
            <h3 class="card-title">排版樣式與字型設定</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>標題對齊方式 (-align):</label>
                    <select id="alignSelect">
                        <option value="center" selected>居中 (center)</option>
                        <option value="left">靠左 (left)</option>
                        <option value="right">靠右 (right)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>書籍語言標籤 (-lang):</label>
                    <select id="langSelect">
                        <option value="zh-TW" selected>zh-TW (臺灣正體)</option>
                        <option value="zh-HK">zh-HK (香港繁體)</option>
                        <option value="zh">zh (中文)</option>
                        <option value="en">en (English)</option>
                        <option value="ja">ja (日本語)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>段落首行縮排字數 (-indent):</label>
                    <input type="number" id="indentInput" value="2" min="0" max="8">
                </div>
                <div class="form-group">
                    <label>章節序號分離顯示:</label>
                    <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                        <input type="checkbox" id="chkSepChap" checked> 序號單獨成行顯示 (-separate-chapter-number)
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>段落間距 (-bottom):</label>
                    <input type="text" id="bottomInput" value="1em">
                    <div class="btn-group" style="margin-top: 6px;">
                        <button class="quick-btn" onclick="document.getElementById('bottomInput').value='0.5em'">0.5em</button>
                        <button class="quick-btn" onclick="document.getElementById('bottomInput').value='1em'">1em</button>
                        <button class="quick-btn" onclick="document.getElementById('bottomInput').value='1.5em'">1.5em</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>行間距/行高 (-line-height):</label>
                    <input type="text" id="lineHeightInput" value="1.85">
                    <div class="btn-group" style="margin-top: 6px;">
                        <button class="quick-btn" onclick="document.getElementById('lineHeightInput').value='1.5rem'">1.5rem</button>
                        <button class="quick-btn" onclick="document.getElementById('lineHeightInput').value='1.75'">1.75</button>
                        <button class="quick-btn" onclick="document.getElementById('lineHeightInput').value='1.85'">1.85</button>
                        <button class="quick-btn" onclick="document.getElementById('lineHeightInput').value='2.0'">2.0</button>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label><input type="checkbox" id="chkTips"> 在電子書結尾添加本軟體說明與教學 (-tips)</label>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 3: 章節與分卷 -->
    <div class="tab-content" id="tab2">
        <div class="card">
            <h3 class="card-title">章節與分卷匹配正則規則</h3>
            <div class="form-group" style="margin-bottom: 14px;">
                <label>章節匹配正則表達式 (-match):</label>
                <input type="text" id="matchInput" placeholder="留空自動識別；例: 第.{1,8}[章節回]">
                <div class="btn-group" style="margin-top: 6px; flex-wrap: wrap;">
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value=''">自動識別</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='^第[0-9一二三四五六七八九十百千零〇两 ]+[章回节節集]'">標準中文章節</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='第[0-9一二三四五六七八九十百千零〇两 ]+[章回节節]';document.getElementById('maxLenInput').value='60';">天涯行內章節 (第X章)</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='^[0-9]+\\s*楼'">天涯/貼吧樓層 (X 樓)</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='^[一二三四五六七八九十]+[、\\.]'">中文大寫序號 (一、二、)</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='^作者:.+?日期:';document.getElementById('maxLenInput').value='60';">論壇發帖 (作者+日期)</button>
                    <button class="quick-btn" onclick="document.getElementById('matchInput').value='Chapter\\s+\\d+'">Chapter N</button>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label><input type="checkbox" id="chkVolume" checked> 啟用分卷識別 (-volume-match)</label>
                <input type="text" id="volumeInput" value="^第[0-9一二三四五六七八九十零〇百千两 ]+[卷部]" style="margin-top: 6px;">
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label>排除無效標題正則 (-exclude):</label>
                <input type="text" id="excludeInput" value="^第[0-9一二三四五六七八九十零〇百千两 ]+(部門|部队|部属|部分|部件|部落|部.*：$)">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>標題最大字數 (-max):</label>
                    <input type="number" id="maxLenInput" value="35" min="10" max="100">
                </div>
                <div class="form-group">
                    <label>未知章節名稱 (-unknow-title):</label>
                    <input type="text" id="unknowTitleInput" value="章節正文">
                </div>
            </div>

            <button class="btn" onclick="testChapterMatch()">🔍 即時測試章節匹配 (目錄預覽)</button>
        </div>
    </div>

    <!-- TAB 4: 封面 -->
    <div class="tab-content" id="tab3">
        <div class="card">
            <h3 class="card-title">封面設定模式 (-cover)</h3>
            <div style="margin-bottom: 12px;">
                <label><input type="radio" name="coverMode" value="auto" checked onchange="toggleCoverMode()"> 自動模式: 偵測小說同目錄下的 cover.png 或 cover.jpg</label>
            </div>
            <div style="margin-bottom: 12px;">
                <label><input type="radio" name="coverMode" value="orly" onchange="toggleCoverMode()"> Orly 經典動物封面 (需連接網路自動產生)</label>
                <div id="orlyOptions" style="display:none; margin-left: 20px; margin-top: 8px;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>封面主題色 (例: #2b579a 或 1-16):</label>
                            <input type="text" id="orlyColorInput" placeholder="留空隨機">
                        </div>
                        <div class="form-group">
                            <label>動物圖案 (0-41):</label>
                            <input type="number" id="orlyIdxInput" value="-1" min="-1" max="41">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 5: 自訂 CSS -->
    <div class="tab-content" id="tab4">
        <div class="card">
            <h3 class="card-title">電子書自訂 CSS 樣式</h3>
            <div class="form-group" style="margin-bottom: 10px;">
                <label>選擇預設樣式範本:</label>
                <select id="cssPresetSelect" onchange="applyCssPreset()">
                    <option value="臺灣典雅實體書 (Classic Book)">臺灣典雅實體書 (Classic Book)</option>
                    <option value="護眼柔和深色模式 (Dark / Night Mode)">護眼柔和深色模式 (Dark / Night Mode)</option>
                    <option value="文青直排直書 (Vertical Reading)">文青直排直書 (Vertical Reading)</option>
                    <option value="極簡無襯線現代風 (Modern Clean)">極簡無襯線現代風 (Modern Clean)</option>
                    <option value="預設樣式 (Kaf 預設)">原版 kaf-cli 預設樣式</option>
                </select>
            </div>
            <textarea id="cssTextarea" rows="12" style="font-family: monospace; font-size: 13px;"></textarea>
        </div>
    </div>

    <!-- TAB 6: 日誌與下載 -->
    <div class="tab-content" id="tab5">
        <div class="card">
            <h3 class="card-title">轉換控制台日誌</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="log-box" id="logBox">等待轉換任務啟動...</div>
        </div>
        <div class="card" id="downloadCard" style="display:none;">
            <h3 class="card-title">✨ 電子書下載</h3>
            <div id="downloadList"></div>
        </div>
    </div>
</div>

<!-- 章節測試彈窗 -->
<div class="modal" id="previewModal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--primary);">章節目錄匹配即時預覽</h3>
        <div id="modalSummary" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;"></div>
        <div class="modal-body">
            <table>
                <thead><tr><th>行號</th><th>類型</th><th>標題</th></tr></thead>
                <tbody id="modalTableBody"></tbody>
            </table>
        </div>
        <div style="text-align: right; margin-top: 15px;">
            <button class="btn" onclick="document.getElementById('previewModal').style.display='none'">關閉</button>
        </div>
    </div>
</div>

<script>
let currentFile = null;
let currentFileContent = null;
let cssPresets = {};

function switchTab(index) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-content').forEach((tc, i) => {
        tc.classList.toggle('active', i === index);
    });
}

function toggleCoverMode() {
    const isOrly = document.querySelector('input[name="coverMode"]:checked').value === 'orly';
    document.getElementById('orlyOptions').style.display = isOrly ? 'block' : 'none';
}

// 載入伺服器狀態與樣式
fetch('/api/status').then(r => r.json()).then(data => {
    const b = document.getElementById('statusBadge');
    const t = document.getElementById('statusText');
    if (data.ready) {
        b.style.color = '#10b981';
        b.style.background = 'rgba(16, 185, 129, 0.15)';
        t.innerText = 'kaf-cli 已就緒 (' + data.version + ')';
    } else {
        b.style.color = '#ef4444';
        b.style.background = 'rgba(239, 68, 68, 0.15)';
        t.innerText = '未檢測到核心執行檔';
    }
});

fetch('/api/css_presets').then(r => r.json()).then(data => {
    cssPresets = data;
    applyCssPreset();
});

function applyCssPreset() {
    const sel = document.getElementById('cssPresetSelect').value;
    if (cssPresets[sel]) {
        document.getElementById('cssTextarea').value = cssPresets[sel].css;
    }
}

function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    currentFile = file;
    document.getElementById('fileInfo').style.display = 'block';

    // 自動解析書名
    let title = file.name.replace(/\.txt$/i, '');
    let author = 'YSTYLE';
    const m = title.match(/《([^》]+)》.*?作者[：:\s]+([^\s\.\(\)\[\]_]+)/i);
    if (m) {
        title = m[1];
        author = m[2];
    }
    document.getElementById('booknameInput').value = title;
    document.getElementById('authorInput').value = author;

    // 讀取前 300KB 用於自動辨識與測試
    const reader = new FileReader();
    reader.onload = function(evt) {
        currentFileContent = evt.target.result;
        autoDetectRule(currentFileContent.slice(0, 300000));
    };
    reader.readAsText(file);
}

function autoDetectRule(sampleText) {
    const banner = document.getElementById('detectBanner');
    if (banner) {
        banner.style.display = 'block';
        banner.innerHTML = '⚡ <b>正在分析小說章節特徵與最佳規則...</b>';
    }
    fetch('/api/auto_detect', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ sample_text: sampleText })
    }).then(r => r.json()).then(data => {
        if (data && data.regex) {
            document.getElementById('matchInput').value = data.regex;
            document.getElementById('maxLenInput').value = data.max_len;
            if (banner) {
                banner.innerHTML = `⚡ <b>系統已自動套用最佳章節規則：</b><span style="color:#60a5fa;font-weight:bold;">${data.rule_name}</span> (預估 <b>${data.chapter_count}</b> 章，標題長度上限 ${data.max_len} 字)`;
            }
        } else if (banner) {
            banner.innerHTML = `ℹ️ <b>未發現特殊論壇格式</b>，已套用 kaf-cli 預設章節規則`;
        }
    }).catch(e => {
        if (banner) banner.style.display = 'none';
    });
}

function testChapterMatch() {
    if (!currentFile) {
        alert('請先選取 TXT 小說檔案！');
        return;
    }
    const payload = {
        sample_text: currentFileContent ? currentFileContent.slice(0, 300000) : '',
        match_regex: document.getElementById('matchInput').value,
        volume_regex: document.getElementById('chkVolume').checked ? document.getElementById('volumeInput').value : 'false',
        exclude_regex: document.getElementById('excludeInput').value,
        max_len: parseInt(document.getElementById('maxLenInput').value) || 35
    };
    fetch('/api/test_regex', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    }).then(r => r.json()).then(data => {
        if (data.error) {
            alert('測試出錯: ' + data.error);
            return;
        }
        document.getElementById('modalSummary').innerHTML = 
            `掃描章節數: <b>${data.chapters_found}</b> | 分卷數: <b>${data.volumes_found}</b> | 排除無效行: <b>${data.excluded_count}</b>`;
        const tbody = document.getElementById('modalTableBody');
        tbody.innerHTML = '';
        (data.preview_items || []).forEach(it => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${it.line_no}</td><td style="color:${it.type==='卷'?'#10b981':'#3b82f6'};font-weight:bold;">${it.type}</td><td>${it.title}</td>`;
            tbody.appendChild(tr);
        });
        document.getElementById('previewModal').style.display = 'flex';
    });
}

function startConvert() {
    if (!currentFile) {
        alert('請先選取 TXT 小說檔案！');
        return;
    }
    switchTab(5); // 切換到日誌分頁
    const logBox = document.getElementById('logBox');
    logBox.innerText = '正在上傳檔案並開始轉換...\n';
    document.getElementById('progressFill').style.width = '20%';

    const formData = new FormData();
    formData.append('file', currentFile);
    formData.append('bookname', document.getElementById('booknameInput').value);
    formData.append('author', document.getElementById('authorInput').value);
    formData.append('format', document.getElementById('formatSelect').value);
    formData.append('zh_conversion', document.getElementById('zhSelect').value);
    formData.append('align', document.getElementById('alignSelect').value);
    formData.append('lang', document.getElementById('langSelect').value);
    formData.append('indent', document.getElementById('indentInput').value);
    formData.append('bottom', document.getElementById('bottomInput').value);
    formData.append('line_height', document.getElementById('lineHeightInput').value);
    formData.append('separate_chapter_number', document.getElementById('chkSepChap').checked);
    formData.append('tips', document.getElementById('chkTips').checked);
    formData.append('match_regex', document.getElementById('matchInput').value);
    formData.append('volume_regex', document.getElementById('chkVolume').checked ? document.getElementById('volumeInput').value : 'false');
    formData.append('exclude_regex', document.getElementById('excludeInput').value);
    formData.append('max_title_len', document.getElementById('maxLenInput').value);
    formData.append('unknow_title', document.getElementById('unknowTitleInput').value);
    formData.append('cover_mode', document.querySelector('input[name="coverMode"]:checked').value);
    formData.append('orly_color', document.getElementById('orlyColorInput').value);
    formData.append('orly_idx', document.getElementById('orlyIdxInput').value);
    formData.append('custom_css_content', document.getElementById('cssTextarea').value);

    fetch('/api/convert', {
        method: 'POST',
        body: formData
    }).then(r => r.json()).then(res => {
        document.getElementById('progressFill').style.width = '100%';
        logBox.innerText += '\n' + (res.logs || []).join('\n') + '\n';
        if (res.success) {
            logBox.innerText += '\n✨ 轉換成功！\n';
            showDownloads(res.generated_files || []);
        } else {
            logBox.innerText += '\n❌ 轉換失敗: ' + res.message + '\n';
        }
    }).catch(err => {
        logBox.innerText += '\n網路或伺服器錯誤: ' + err;
    });
}

function showDownloads(files) {
    const card = document.getElementById('downloadCard');
    const list = document.getElementById('downloadList');
    list.innerHTML = '';
    files.forEach(f => {
        const div = document.createElement('div');
        div.className = 'download-item';
        div.innerHTML = `<span>📖 <b>${f.filename}</b> (${(f.size/1024).toFixed(1)} KB)</span>
                         <a href="/api/download?file=${encodeURIComponent(f.path)}" class="btn btn-primary" download>下載電子書</a>`;
        list.appendChild(div);
    });
    card.style.display = 'block';
}
</script>
